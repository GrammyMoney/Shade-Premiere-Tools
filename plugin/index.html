<!--
  Panel markup. UXP's CSS is a silent subset (measured in premiere-events on
  26.5.1): no box-shadow, <button> ignores background and border, and body
  does not fill a docked panel. So: flexbox, background-color, border and
  border-radius only, and styled <div>s instead of buttons. gap, grid, CSS
  variables and transitions are unverified and avoided.
-->
<style>
  html, body { height: 100%; margin: 0; background-color: #121212; }

  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    padding: 12px;
    color: #e8e6e1;
    box-sizing: border-box;
  }

  .status { display: flex; align-items: center; margin-bottom: 14px; }
  .title { flex: none; color: #8a8a86; }
  .state { flex: 1; text-align: right; }
  .state.bad { color: #f2594b; }

  /* A glow drawn from translucent circles: box-shadow renders nothing. */
  .lamp {
    width: 20px; height: 20px; border-radius: 10px; margin-left: 8px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .lamp .mid {
    width: 13px; height: 13px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
  }
  .lamp .core { width: 7px; height: 7px; border-radius: 4px; background-color: #6a6a66; }
  .lamp.ok { background-color: rgba(70, 224, 138, 0.13); }
  .lamp.ok .mid { background-color: rgba(70, 224, 138, 0.28); }
  .lamp.ok .core { background-color: #46e08a; }
  .lamp.bad { background-color: rgba(242, 89, 75, 0.13); }
  .lamp.bad .mid { background-color: rgba(242, 89, 75, 0.28); }
  .lamp.bad .core { background-color: #f2594b; }

  .rule { height: 1px; background-color: #3a3a38; margin-bottom: 11px; }

  .stats { margin-bottom: 12px; }
  .stat { display: flex; }
  .stat .k { flex: 1; color: #8a8a86; }
  .stat .v { flex: none; }
  .stat .v.zero { color: #8a8a86; }

  .meta { color: #8a8a86; margin-bottom: 12px; }

  .keyrow { display: flex; align-items: center; margin-bottom: 12px; }
  .keyrow input { flex: 1; margin-right: 6px; }

  .actions { display: flex; }
  .act {
    flex: 1; text-align: center; color: #e8e6e1;
    border: 1px solid #3a3a38; border-radius: 6px; padding: 5px 8px;
  }
  .act.solo { flex: none; }
  .act:first-child { margin-right: 6px; }
  .act:hover { border-color: #6a6a66; }
  .act:active { background-color: #181818; }

  /* Shown only when a drive lacks the fields. Amber: needs a decision, not
     broken. */
  .setup {
    border: 1px solid #6b5a2a; border-radius: 6px; padding: 8px;
    margin-bottom: 12px; background-color: rgba(240, 190, 70, 0.06);
  }
  .setup .msg { color: #e8c66a; margin-bottom: 8px; }
  .setup .list { color: #8a8a86; margin-bottom: 8px; }
  .setup .act.go { border-color: #8a7433; }

  .link { color: #8a8a86; margin-top: 10px; }
  .link:hover { color: #e8e6e1; }
  .note { color: #8a8a86; margin-top: 10px; word-wrap: break-word; }
</style>

<div class="status">
  <div class="title">Shade</div>
  <div class="state" id="state">starting…</div>
  <div class="lamp" id="lamp"><div class="mid"><div class="core"></div></div></div>
</div>

<div class="rule"></div>

<div class="keyrow" id="keyrow" style="display: none;">
  <input type="password" id="key" placeholder="sk_… API key" />
  <div class="act solo" id="savekey">save</div>
</div>

<div class="setup" id="setup" style="display: none;">
  <div class="msg" id="setupmsg"></div>
  <div class="list" id="setuplist"></div>
  <div class="actions">
    <div class="act" id="setupcancel" style="display: none;">cancel</div>
    <div class="act go" id="setupgo">set up drive</div>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="k">project</div><div class="v" id="n-project">—</div></div>
  <div class="stat"><div class="k">files in project</div><div class="v" id="n-files">—</div></div>
  <div class="stat"><div class="k">on Shade</div><div class="v" id="n-shade">—</div></div>
  <div class="stat"><div class="k">on a timeline</div><div class="v" id="n-used">—</div></div>
  <div class="stat"><div class="k">written last sync</div><div class="v" id="n-written">—</div></div>
</div>

<div class="meta" id="meta"></div>

<div class="actions">
  <div class="act" id="logs">get logs</div>
  <div class="act" id="sync">sync now</div>
</div>

<div class="link" id="changekey" style="display: none;">change API key</div>
<div class="note" id="note"></div>

<script src="main.js"></script>
